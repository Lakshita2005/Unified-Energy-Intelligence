# Alembic configuration.
#
# The database URL is intentionally NOT configured here. migrations/env.py builds
# it from the DB_* environment variables (see .env.example), so credentials never
# live in version-controlled files.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
