# ---------------------------------------------------------------- Grid-India (NLDC Daily PSP, 9 sections)
[[schedule]]
key = "GRID_INDIA_PSP"
description = "NLDC Daily PSP workbook (all nine sections), published D+1 about 10:00-12:30 IST; revisions later"
checker = "grid_india_psp"
enabled = true
source = "GRID_INDIA"
datasets = ["GRID_INDIA_PSP_DAILY", "GRID_INDIA_PSP_STATES", "GRID_INDIA_GENERATION", "GRID_INDIA_PSP_OUTAGE",
            "GRID_INDIA_EXCHANGE", "GRID_INDIA_PSP_IR_LINES", "GRID_INDIA_PSP_INTL_LINES",
            "GRID_INDIA_PSP_CROSSBORDER", "GRID_INDIA_SCADA"]
lock_group = "GRID_INDIA"
every = "1h"
windows = [{ start = "09:00", end = "14:00", every = "15m" }]
[schedule.params]
sections = ["supply", "states", "fuel", "outage", "exchange", "ir_lines", "intl_lines", "crossborder", "timeseries"]
late_after_hours = 16

# ---------------------------------------------------------------- NPP (MERIT India dashboard)
[[schedule]]
key = "NPP_DEMAND"
description = "NPP All-India demand met snapshots (every 2-4 minutes at the source)"
checker = "npp"
enabled = false
source = "NPP"
datasets = ["NPP_DEMAND"]
lock_group = "NPP"
every = "30m"
[schedule.params]
kind = "demand"

[[schedule]]
key = "NPP_GENERATION"
description = "NPP All-India generation by source snapshots"
checker = "npp"
enabled = false
source = "NPP"
datasets = ["NPP_GENERATION"]
lock_group = "NPP"
every = "30m"
[schedule.params]
kind = "generation"

# ---------------------------------------------------------------- MOSDAC (forecast series, no issue time)
# Solar and wind are independent schedules: separate checks, jobs, retries and watermarks. A wind outage
# never fails or hides a solar ingestion, and wind recovers on its own checks (no new solar series needed).
# Same lock group: at most one MOSDAC job at a time (source politeness), but neither waits on the other's result.
[[schedule]]
key = "MOSDAC_SOLAR"
description = "MOSDAC solar energy forecast for the configured plants; new series detected via one probe"
checker = "mosdac"
enabled = true
source = "MOSDAC"
datasets = ["MOSDAC_SOLAR_FORECAST"]
lock_group = "MOSDAC"
every = "3h"
[schedule.params]
kind = "solar"

[[schedule]]
key = "MOSDAC_WIND"
description = "MOSDAC wind energy forecast for the configured plants (endpoint has had HTTP 500 outages)"
checker = "mosdac"
enabled = true
source = "MOSDAC"
datasets = ["MOSDAC_WIND_FORECAST"]
lock_group = "MOSDAC"
every = "1h"
[schedule.params]
kind = "wind"

# ---------------------------------------------------------------- Open-Meteo
[[schedule]]
key = "OPEN_METEO_FORECAST"
description = "Open-Meteo forecast refresh every 6 hours (free endpoint: non-commercial use only)"
checker = "open_meteo_forecast"
enabled = false
source = "OPEN_METEO"
datasets = ["OPEN_METEO_FORECAST"]
lock_group = "OPEN_METEO"
every = "30m"
[schedule.params]
slots = ["01:30", "07:30", "13:30", "19:30"]
forecast_days = 7

[[schedule]]
key = "OPEN_METEO_HISTORICAL"
description = "Open-Meteo archive (ERA5, about 5 days behind): keep disabled"
checker = "open_meteo_historical"
enabled = false
source = "OPEN_METEO"
datasets = ["OPEN_METEO_HISTORICAL"]
lock_group = "OPEN_METEO"
every = "off"
windows = [{ start = "03:00", end = "04:00", every = "1h" }]
catchup_enabled = false
[schedule.params]
lag_days = 6
