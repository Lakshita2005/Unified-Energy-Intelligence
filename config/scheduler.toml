# Availability-based scheduler configuration (src/scheduler, docs/scheduler.md).
#
# ENABLED (approved 2026-11-26): IEX_DAM, IEX_GDAM, IEX_RTM, GRID_INDIA_PSP, CEA_COAL_DAILY, CEA_DGR_DAILY,
# CEA_PSP_MONTHLY, MOSDAC_SOLAR, MOSDAC_WIND. Every other schedule is disabled.
# A schedule runs only when ALL of these hold (re-checked every tick):
#   1. SCHEDULER_GLOBAL_ENABLE=true in the environment (.env),
#   2. enabled = true below,
#   3. this exact configuration has been copied to the database: python -m scripts.pi_jobs sync-config
#      (the scheduler compares a hash of each schedule with the synced copy and REFUSES to run a
#      schedule whose file configuration differs from the database),
#   4. an administrator enabled it in the database: python -m scripts.pi_jobs enable <KEY>
#      (run as the admin role; the application role pi_app cannot change pi_jobs.schedule.enabled).
#
# Activation candidates (2026-11-25: the company confirmed permission to use the source data for
# internal operations): CEA_COAL_DAILY, CEA_DGR_DAILY, CEA_PSP_MONTHLY, IEX_DAM, IEX_GDAM, IEX_RTM,
# GRID_INDIA_PSP (all nine sections), NPP_DEMAND, NPP_GENERATION, MOSDAC_SOLAR, MOSDAC_WIND.
# The others stay disabled until activation is approved schedule by schedule.
#
# OPEN_METEO_FORECAST / OPEN_METEO_HISTORICAL use the FREE endpoint (https://api.open-meteo.com/v1/forecast,
# OPEN_METEO_PLAN=free, no API key): NON-COMMERCIAL USE ONLY, fewer than 10,000 API calls a day, data under
# CC BY 4.0 (attribution to Open-Meteo.com required). Disabled by default; activate only for non-commercial
# use. The scheduler refuses them if a key is set on the free plan (no silent switch to the paid customer-
# endpoint), if OPEN_METEO_PLAN=commercial has no key, or if their worst-case calls exceed the daily limit.
#
# Times are local (timezone). Window intervals apply inside the window; 'every' applies outside
# all windows ("off" = no checks outside the windows). Catch-up never looks further back than
# catchup_max_days (no historical backfill).

[defaults]
timezone = "Asia/Kolkata"
max_attempts = 5
backoff_base = "2m"
backoff_max = "30m"
failure_cooldown = "6h"
catchup_enabled = true
catchup_max_days = 7

# ---------------------------------------------------------------- CEA (NPP mirror / cea.nic.in)
[[schedule]]
key = "CEA_COAL_DAILY"
description = "CEA daily coal stock report (published D+1, usually about 15:30 IST)"
checker = "cea_daily"
enabled = true
source = "CEA"
datasets = ["CEA_COAL_STOCK_DAILY"]
lock_group = "CEA"
every = "2h"
windows = [{ start = "12:00", end = "24:00", every = "30m" }]
[schedule.params]
reports = ["coal"]
revision_days = 2
late_after_hours = 48

[[schedule]]
key = "CEA_DGR_DAILY"
description = "CEA daily generation report: unit outages (dgr10) and plant daily (dgr2), D+1 about 17:00 IST"
checker = "cea_daily"
enabled = true
source = "CEA"
datasets = ["CEA_DGR_DAILY"]
lock_group = "CEA"
every = "2h"
windows = [{ start = "14:00", end = "24:00", every = "30m" }]
[schedule.params]
reports = ["dgr10", "dgr2"]
revision_days = 2
late_after_hours = 48

[[schedule]]
key = "CEA_PSP_MONTHLY"
description = "CEA monthly Power Supply Position (energy and peak); provisional issues re-checked for revision daily"
checker = "cea_psp"
enabled = true
source = "CEA"
datasets = ["CEA_PSP_ENERGY_MONTHLY", "CEA_PSP_PEAK_MONTHLY"]
lock_group = "CEA"
every = "off"
windows = [{ start = "10:00", end = "10:30", every = "30m" }, { start = "18:00", end = "18:30", every = "30m" }]
[schedule.params]
measures = ["ENERGY", "PEAK"]
months_back = 3

