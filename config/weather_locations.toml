# Weather locations for Open-Meteo ingestion (src/pipelines/open_meteo).
#
# Format and field rules: see config/weather_locations.example.toml.
# The eight solar plants below use the same codes and coordinates as
# config/mosdac_locations.toml.
#
# None of these codes exists in pi.plant (checked 2026-11-20), so no plant_code
# is set. Registered locations are never moved: once a code is registered in
# pi.weather_location, its coordinates must not change here (use a new code).
#
# The technical test point TEST_ONLY_DELHI_GRID is intentionally NOT listed here
# (it lives in config/weather_locations.test_only.toml).

[[location]]
code = "ESEPL"
name = "ESEPL"
latitude = 17.4042
longitude = 77.3753
